<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062A1D">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Nova lozinka | Starrlen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    background: #062A1D;
    color: #F2EBD3;
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }
  header { padding: 32px 24px 8px; text-align: center; }
  h1 { margin: 0; font-size: 2.25rem; font-weight: 700; letter-spacing: 0.04em; color: #D4AF37; }
  main { max-width: 420px; margin: 0 auto; padding: 16px 24px 48px; }
  h2 { font-size: 1.25rem; margin: 24px 0 8px; color: #D4AF37; text-align: center; }
  p { margin: 8px 0; }
  .muted { color: #B9C2B5; font-size: 0.95rem; text-align: center; }
  .email { color: #D4AF37; word-break: break-all; }
  form { margin-top: 20px; }
  label { display: block; margin: 16px 0 6px; font-size: 0.95rem; }
  input {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    color: #F2EBD3; background: #0B3A28; border: 1px solid #677769; border-radius: 8px;
  }
  input:focus { outline: 2px solid #D4AF37; outline-offset: 1px; border-color: #D4AF37; }
  button {
    width: 100%; margin-top: 24px; padding: 13px; font-size: 1rem; font-weight: 700; font-family: inherit;
    color: #062A1D; background: #D4AF37; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.95rem; }
  .msg.error { background: #3B1B1B; border: 1px solid #A55; color: #FFD9D9; }
  .msg.ok { background: #12402C; border: 1px solid #D4AF37; color: #F2EBD3; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Starrlen</h1>
  </header>

  <main>
    <p id="loading" class="muted">Provjeravam link…</p>

    <section id="formSection" hidden>
      <h2>Nova lozinka</h2>
      <p class="muted">Račun: <span id="emailLabel" class="email"></span></p>
      <form id="resetForm" novalidate>
        <label for="pw1">Nova lozinka</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="6" required>
        <label for="pw2">Potvrdite lozinku</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
        <div id="formError" class="msg error" role="alert" hidden></div>
        <button id="submitBtn" type="submit">Spremi novu lozinku</button>
      </form>
    </section>

    <section id="doneSection" hidden>
      <h2>Gotovo</h2>
      <div id="doneText" class="msg ok">Lozinka je uspješno promijenjena. Sada se možete prijaviti u aplikaciju novom lozinkom.</div>
    </section>

    <section id="errorSection" hidden>
      <h2>Nešto nije u redu</h2>
      <div id="errorText" class="msg error" role="alert"></div>
      <p class="muted">U aplikaciji ponovno odaberite „Zaboravili ste lozinku?” i zatražite novi link.</p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode');
    var oobCode = params.get('oobCode');
    var apiKey = params.get('apiKey');

    var el = function (id) { return document.getElementById(id); };
    var show = function (id) { el(id).hidden = false; };
    var hide = function (id) { el(id).hidden = true; };

    var ERRORS = {
      'auth/expired-action-code': 'Link je istekao. Zatražite novi link za promjenu lozinke.',
      'auth/invalid-action-code': 'Link je neispravan ili je već iskorišten. Zatražite novi link za promjenu lozinke.',
      'auth/user-disabled': 'Ovaj račun je onemogućen.',
      'auth/user-not-found': 'Račun za ovaj link više ne postoji.',
      'auth/weak-password': 'Lozinka je preslaba. Odaberite lozinku s najmanje 6 znakova.',
      'auth/network-request-failed': 'Nema veze s internetom. Provjerite mrežu i pokušajte ponovno.',
      'auth/too-many-requests': 'Previše pokušaja. Pričekajte malo i pokušajte ponovno.'
    };
    function message(err) {
      return ERRORS[err && err.code] || 'Došlo je do pogreške. Pokušajte ponovno ili zatražite novi link.';
    }
    function fatal(text) {
      hide('loading'); hide('formSection');
      el('errorText').textContent = text;
      show('errorSection');
    }

    var EMAIL_MODES = {
      verifyEmail: 'E-mail adresa je potvrđena. Možete se vratiti u aplikaciju.',
      verifyAndChangeEmail: 'E-mail adresa je promijenjena. Prijavite se u aplikaciju novom adresom.',
      recoverEmail: 'Prijašnja e-mail adresa je vraćena. Ako sumnjate da je netko drugi imao pristup računu, promijenite lozinku.'
    };

    if (!(mode === 'resetPassword' || EMAIL_MODES[mode]) || !oobCode || !apiKey) {
      fatal('Link je neispravan ili nepotpun. Otvorite ga izravno iz e-maila koji ste dobili.');
      return;
    }

    firebase.initializeApp({ apiKey: apiKey });
    var auth = firebase.auth();
    var lang = params.get('lang');
    if (lang) { auth.languageCode = lang; }

    if (EMAIL_MODES[mode]) {
      auth.applyActionCode(oobCode).then(function () {
        el('doneText').textContent = EMAIL_MODES[mode];
        hide('loading');
        show('doneSection');
      }).catch(function (err) {
        fatal(message(err));
      });
      return;
    }

    auth.verifyPasswordResetCode(oobCode).then(function (email) {
      el('emailLabel').textContent = email;
      hide('loading');
      show('formSection');
    }).catch(function (err) {
      fatal(message(err));
    });

    el('resetForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pw1 = el('pw1').value;
      var pw2 = el('pw2').value;
      var box = el('formError');
      box.hidden = true;

      if (pw1.length < 6) {
        box.textContent = 'Lozinka mora imati najmanje 6 znakova.';
        box.hidden = false; return;
      }
      if (pw1 !== pw2) {
        box.textContent = 'Lozinke se ne podudaraju.';
        box.hidden = false; return;
      }

      var btn = el('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Spremam…';

      auth.confirmPasswordReset(oobCode, pw1).then(function () {
        hide('formSection');
        show('doneSection');
      }).catch(function (err) {
        var code = err && err.code;
        if (code === 'auth/weak-password' || code === 'auth/network-request-failed' || code === 'auth/too-many-requests') {
          box.textContent = message(err);
          box.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Spremi novu lozinku';
        } else {
          fatal(message(err));
        }
      });
    });
  })();
  </script>
</body>
</html>
